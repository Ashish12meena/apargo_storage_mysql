services:
  storage-service:
    build: .
    container_name: storage-service
    ports:
      - "8030:8031"
    volumes:
      - /var/aigreentick-new-structure-node-spring/spring-boot/apargo_storage_mysql/media-uploads:/app/media-uploads
    environment:
      # Storage paths — container paths
      - MEDIA_UPLOAD_PATH=/app/media-uploads
      - STORAGE_ROOT_PATH=/app/media-uploads
      - STORAGE_TEMP_PATH=/app/media-uploads/temp
      - STORAGE_PROVIDER=local
      - LOCAL_STORAGE_ROOT=/app/media-uploads
      - LOCAL_STORAGE_BASE_URL=http://146.88.24.113:8030/api/v1/media/serve/

      # Media base url
      - MEDIA_BASE_URL=http://146.88.24.113:8030/api/v1/media/serve/

      # Database
      - DB_URL=jdbc:mysql://146.88.24.113:3306/apargo_storage_mysql
      - DB_USERNAME=root
      - DB_PASSWORD=meenagaming12@#

      # Spring Boot runs on 8031 inside container
      - SERVER_PORT=8031

      # Eureka
      - EUREKA_ENABLED=false

      # Rate limiting
      - RATE_LIMIT_ENABLED=true

    restart: always