# Development profile: only what differs from application.yml.
#
# Addresses (MySQL, Redis, Kafka, STORAGE_SERVICE_URL) and the database name/credentials are NOT
# set here: they come from ../platform.env (or ./.env), with application.yml holding the fallback.
# Every value below is a ${VAR:default} placeholder, because .env and platform.env rank BELOW this
# file and can only reach it through a placeholder (docs/configuration/02 §2, rule P1).

spring:
  jpa:
    show-sql: ${JPA_SHOW_SQL:false}

logging:
  level:
    com.apargo.services.storage: ${LOG_LEVEL_APP:${LOG_LEVEL:DEBUG}}
    # Uncomment to see Hibernate's statements and their bound parameters. Both
    # loggers, via the group declared in application.yml — setting only
    # org.hibernate.SQL prints every parameter as '?'.
    # sql: DEBUG

  request:
    # Both ends of every request on a developer machine: seeing the arrival line
    # is how you tell "the request never reached the service" apart from "the
    # service took the request and hung".
    log-start: ${LOG_REQUEST_START:true}
    start-level: ${LOG_REQUEST_START_LEVEL:INFO}
    # Local disks and a local MinIO are slower than production storage, so the
    # production 2s threshold would flag ordinary uploads as slow all day.
    slow-threshold: ${LOG_REQUEST_SLOW_THRESHOLD:PT5S}
    include-headers: ${LOG_REQUEST_HEADERS:true}
